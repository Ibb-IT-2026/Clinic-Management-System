<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="نظام إدارة عيادة الأسنان الحديث - تسجيل الدخول">
    <title>تسجيل الدخول - نظام إدارة عيادة الأسنان</title>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Shared Styles -->
    <link rel="stylesheet" href="shared/css/variables.css">
    <link rel="stylesheet" href="shared/css/global.css">
    <!--<link rel="stylesheet" href="shared/css/responsive.css">-->

    <!-- Page-Specific Style -->
    <link rel="stylesheet" href="pages/login/login.css">
</head>
<body>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-brand-icon">
                <i class="fas fa-tooth"></i>
            </div>
            <h1 class="login-title">عيادة د. علي محمد</h1>
            <p class="login-subtitle">نظام الإدارة الإلكتروني المتكامل للعيادة</p>

            <div id="login-error-alert" class="alert alert-danger" style="display: none;">
                <i class="fas fa-exclamation-circle"></i> اسم المستخدم أو كلمة المرور غير صحيحة
            </div>

            <form id="login-form" class="login-form">
                <div class="form-group">
                    <label for="username">اسم المستخدم</label>
                    <div class="input-with-icon">
                        <i class="fas fa-user"></i>
                        <input type="text" id="username" class="form-control" placeholder="أدخل اسم المستخدم (مثال: admin)" value="admin" required autofocus>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">كلمة المرور</label>
                    <div class="input-with-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" class="form-control" placeholder="أدخل كلمة المرور" value="123456" required>
                    </div>
                </div>

                <div class="login-options">
                    <label class="remember-me">
                        <input type="checkbox" id="remember-me" checked>
                        <span>تذكر بياناتي</span>
                    </label>
                    <a href="javascript:void(0)" onclick="alert('في بيئة العرض التوضيحي، يمكنك الدخول بأي اسم مستخدم وكلمة مرور')" style="color: var(--text-muted); font-size: 0.85rem;">نسيت كلمة المرور؟</a>
                </div>

                <button type="submit" class="btn btn-primary btn-login-submit" id="submit-login-btn">
                    <i class="fas fa-sign-in-alt"></i> تسجيل الدخول
                </button>
            </form>

            <div class="login-demo-hint">
                <i class="fas fa-info-circle"></i> <strong>ملاحظة للمناقشة:</strong> يمكنك تسجيل الدخول بـ <code>admin</code> أو أي بيانات أخرى لغرض التجربة في مقرر هندسة البرمجيات.
            </div>
        </div>
    </div>

    <!-- Dark Mode Togddgle Floating Button -->
    <div class="dark-mode-toggle">
        <button class="dark-mode-btn" id="dark-mode-toggle" title="التبديل إلى الوضع الليلي">
            <i class="fas fa-moon"></i>
        </button>
    </div>

    <!-- Shared Scripts -->
    <script src="shared/js/mock-data.js"></script>
    <script src="shared/js/storage.js"></script>
    <script src="shared/js/auth-guard.js"></script>
    <script src="shared/js/common.js"></script>

    <!-- Page-Specific Script -->
    <!--<script src="pages/login/login.js"></script>-->

</body>
</html>
