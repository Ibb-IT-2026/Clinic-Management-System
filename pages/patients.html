<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المرضى - نظام إدارة عيادة الأسنان</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="../styles/variables.css">
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../styles/layout.css">
    <link rel="stylesheet" href="../styles/components.css">
    <link rel="stylesheet" href="../styles/forms.css">
    <link rel="stylesheet" href="../styles/responsive.css">
</head>

<body>

    <header>
        <div class="header-content">
            <div class="logo">
                <i class="fas fa-tooth"></i>
                <span>عيادة الأسنان - د. علي محمد</span>
            </div>
            <div class="user-info">
                <div class="user-avatar">د.ع</div>
                <div>
                    <p>د. علي محمد</p>
                    <p>طبيب أسنان</p>
                </div>
                <button id="logout-btn" class="btn" style="background-color: white; color: var(--primary-color);">
                    <i class="fas fa-sign-out-alt"></i> خروج
                </button>
            </div>
        </div>
    </header>

    <div class="container" style="margin-top: 20px;">
        <nav>
            <ul class="nav-links">
                <li><a href="dashboard.html"><i class="fas fa-home"></i> الرئيسية</a></li>
                <li><a href="patients.html" class="active"><i class="fas fa-users"></i> المرضى</a></li>
                <li><a href="appointments.html"><i class="fas fa-calendar-plus"></i> إضافة موعد</a></li>
                <li><a href="payments.html"><i class="fas fa-money-bill-wave"></i> المدفوعات</a></li>
                <li><a href="records.html"><i class="fas fa-file-medical"></i> سجلات المرضى</a></li>
            </ul>
        </nav>

        <div class="main-content active">
            <h2 class="section-title">إدارة المرضى</h2>

            <div class="search-container">
                <input type="text" class="search-input" id="patient-search"
                    placeholder="ابحث عن مريض بالاسم أو رقم الهاتف...">
                <button class="search-btn" id="search-patient-btn">
                    <i class="fas fa-search"></i> بحث
                </button>
                <button class="btn btn-add" id="add-patient-btn">
                    <i class="fas fa-user-plus"></i> إضافة مريض جديد
                </button>
            </div>

            <div id="patient-alert" style="display: none;"></div>

            <!-- Add Patient Form -->
            <div id="add-patient-form" class="form-container" style="display: none; margin-bottom: 30px;">
                <h3 style="margin-bottom: 25px; color: var(--secondary-color);" id="patient-form-title">إضافة مريض جديد
                </h3>
                <form id="patient-form">
                    <div class="form-group">
                        <label for="patient-name">الاسم الكامل *</label>
                        <input type="text" id="patient-name" class="form-control" placeholder="أدخل الاسم الكامل"
                            required>
                    </div>

                    <div class="form-group">
                        <label>الجنس *</label>
                        <div class="radio-group">
                            <label class="radio-option">
                                <input type="radio" name="gender" value="male" required> ذكر
                            </label>
                            <label class="radio-option">
                                <input type="radio" name="gender" value="female"> أنثى
                            </label>
                        </div>
                    </div>

                    <div class="form-group" id="pregnancy-field" style="display: none;">
                        <label>هل أنت حامل؟ (للمريضات فقط)</label>
                        <div class="radio-group">
                            <label class="radio-option">
                                <input type="radio" name="pregnancy" value="yes"> نعم
                            </label>
                            <label class="radio-option">
                                <input type="radio" name="pregnancy" value="no"> لا
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="patient-phone">رقم الهاتف *</label>
                        <input type="tel" id="patient-phone" class="form-control" placeholder="05XXXXXXXX" required>
                    </div>

                    <div class="form-group">
                        <label>هل يعاني من أمراض مزمنة؟ *</label>
                        <div class="radio-group">
                            <label class="radio-option">
                                <input type="radio" name="chronic-disease" value="yes" required> نعم
                            </label>
                            <label class="radio-option">
                                <input type="radio" name="chronic-disease" value="no"> لا
                            </label>
                        </div>
                    </div>

                    <div class="form-group" id="disease-details-field" style="display: none;">
                        <label for="disease-details">يرجى ذكر الأمراض المزمنة</label>
                        <textarea id="disease-details" class="form-control" rows="3"
                            placeholder="اذكر الأمراض المزمنة إن وجدت..."></textarea>
                    </div>

                    <div class="form-group" style="display: flex; gap: 15px; margin-top: 30px;">
                        <button type="submit" class="btn btn-add" id="patient-submit-btn" style="flex: 1;">
                            <i class="fas fa-save"></i> حفظ المريض
                        </button>
                        <button type="button" id="cancel-patient" class="btn btn-cancel" style="flex: 1;">
                            <i class="fas fa-times"></i> إلغاء
                        </button>
                    </div>
                </form>
            </div>

            <!-- Patients Table -->
            <div class="table-container">
                <table id="patients-table">
                    <thead>
                        <tr>
                            <th>اسم المريض</th>
                            <th>الجنس</th>
                            <th>رقم الهاتف</th>
                            <th>أمراض مزمنة</th>
                            <th>الإجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="patients-table-body">
                        <!-- Filled by JS -->
                    </tbody>
                </table>
            </div>

            <!-- Trash Section -->
            <div class="trash-section" id="trash-section" style="display: none;">
                <div class="trash-header"
                    style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h3 style="color: var(--danger-color); margin: 0;"><i class="fas fa-trash"></i> سلة المحذوفات</h3>
                    <button class="btn btn-delete" id="empty-trash-btn"
                        style="background-color: var(--danger-color); color: white;">
                        <i class="fas fa-trash-alt"></i> تفريغ السلة
                    </button>
                </div>
                <div class="table-container">
                    <table id="trash-table">
                        <thead>
                            <tr>
                                <th>اسم المريض</th>
                                <th>الجنس</th>
                                <th>رقم الهاتف</th>
                                <th>تاريخ الحذف</th>
                                <th>الإجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="trash-table-body">
                            <!-- Filled by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="dark-mode-toggle">
        <button class="dark-mode-btn" id="dark-mode-toggle">
            <i class="fas fa-moon"></i>
        </button>
    </div>

    <script src="../js/api.js"></script>

    <script src="../js/utils.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/dark-mode.js"></script>
    <script src="../js/patients.js"></script>
    <script src="../js/app.js"></script>

    <script>
        // Check for URL params to auto-open add form
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('action') === 'add') {
            document.addEventListener('DOMContentLoaded', () => {
                const addBtn = document.getElementById('add-patient-btn');
                if (addBtn) addBtn.click();
            });
        }
    </script>
</body>

</html>
