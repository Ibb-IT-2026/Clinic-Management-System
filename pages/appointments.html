<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة موعد - نظام إدارة عيادة الأسنان</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="../styles/variables.css">
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../styles/layout.css">
    <link rel="stylesheet" href="../styles/components.css">
    <link rel="stylesheet" href="../styles/forms.css">
    <link rel="stylesheet" href="../styles/responsive.css">
</head>

<body>

    <header>
        <div class="header-content">
            <div class="logo">
                <i class="fas fa-tooth"></i>
                <span>عيادة الأسنان - د. علي محمد</span>
            </div>
            <div class="user-info">
                <div class="user-avatar">د.ع</div>
                <div>
                    <p>د. علي محمد</p>
                    <p>طبيب أسنان</p>
                </div>
                <button id="logout-btn" class="btn" style="background-color: white; color: var(--primary-color);">
                    <i class="fas fa-sign-out-alt"></i> خروج
                </button>
            </div>
        </div>
    </header>

    <div class="container" style="margin-top: 20px;">
        <nav>
            <ul class="nav-links">
                <li><a href="dashboard.html"><i class="fas fa-home"></i> الرئيسية</a></li>
                <li><a href="patients.html"><i class="fas fa-users"></i> المرضى</a></li>
                <li><a href="appointments.html" class="active"><i class="fas fa-calendar-plus"></i> إضافة موعد</a></li>
                <li><a href="payments.html"><i class="fas fa-money-bill-wave"></i> المدفوعات</a></li>
                <li><a href="records.html"><i class="fas fa-file-medical"></i> سجلات المرضى</a></li>
            </ul>
        </nav>

        <div class="main-content active">
            <h2 class="section-title">إضافة موعد جديد</h2>

            <div class="form-container">
                <form id="appointment-form">
                    <div class="form-group">
                        <label for="appointment-patient">اختيار المريض *</label>
                        <select id="appointment-patient" class="form-control" required>
                            <option value="">اختر مريضاً</option>
                            <!-- JS populated -->
                        </select>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="visit-type">نوع الزيارة *</label>
                            <select id="visit-type" class="form-control" required>
                                <option value="">اختر نوع الزيارة</option>
                                <option value="extraction">قلع</option>
                                <option value="filling">حشو</option>
                                <option value="cleaning">تنظيف</option>
                                <option value="checkup">كشف</option>
                                <option value="root-canal">علاج عصب</option>
                                <option value="other">أخرى</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="appointment-date">التاريخ *</label>
                            <input type="date" id="appointment-date" class="form-control" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="total-amount">المبلغ الكلي (ريال) *</label>
                            <input type="number" id="total-amount" class="form-control" min="0" step="0.01" required>
                        </div>

                        <div class="form-group">
                            <label for="paid-amount">المبلغ المدفوع (ريال) *</label>
                            <input type="number" id="paid-amount" class="form-control" min="0" step="0.01" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="remaining-amount">المبلغ المتبقي (ريال)</label>
                        <input type="number" id="remaining-amount" class="form-control" readonly>
                    </div>

                    <div class="form-group">
                        <label>هل يحتاج إلى عودة؟</label>
                        <div class="radio-group">
                            <label class="radio-option">
                                <input type="radio" name="return-visit" value="yes" id="return-yes"> نعم
                            </label>
                            <label class="radio-option">
                                <input type="radio" name="return-visit" value="no" id="return-no" checked> لا
                            </label>
                        </div>
                    </div>

                    <div class="hidden-section" id="return-details">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="return-date">تاريخ العودة *</label>
                                <input type="date" id="return-date" class="form-control">
                            </div>

                            <div class="form-group">
                                <label for="return-type">نوع العودة *</label>
                                <select id="return-type" class="form-control">
                                    <option value="">اختر نوع العودة</option>
                                    <option value="follow-up">متابعة</option>
                                    <option value="cleaning">تنظيف</option>
                                    <option value="checkup">كشف</option>
                                    <option value="treatment">استكمال علاج</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- New: Screening Rays Upload -->
                    <div class="form-group" style="margin-top: 20px;">
                        <label for="appointment-images">صور الكشافة</label>
                        <div class="file-upload-wrapper"
                            style="border: 2px dashed #ddd; padding: 20px; text-align: center; border-radius: 8px; cursor: pointer; transition: all 0.3s ease;">
                            <input type="file" id="appointment-images" accept="image/*" multiple style="display: none;">
                            <div class="upload-placeholder"
                                onclick="document.getElementById('appointment-images').click()">
                                <i class="fas fa-cloud-upload-alt"
                                    style="font-size: 24px; color: var(--primary-color); margin-bottom: 10px;"></i>
                                <p style="margin: 0; color: #666;">اضغط هنا لرفع صور الكشافة</p>
                            </div>
                        </div>
                        <div id="images-preview"
                            style="display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 10px; margin-top: 15px;">
                            <!-- Preview images will appear here -->
                        </div>
                    </div>

                    <div class="form-group" style="display: flex; gap: 15px; margin-top: 30px;">
                        <button type="submit" class="btn btn-add" style="flex: 1;">
                            <i class="fas fa-calendar-plus"></i> حفظ الموعد
                        </button>
                        <button type="button" id="cancel-appointment" class="btn btn-cancel" style="flex: 1;">
                            <i class="fas fa-times"></i> إلغاء
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="dark-mode-toggle">
        <button class="dark-mode-btn" id="dark-mode-toggle">
            <i class="fas fa-moon"></i>
        </button>
    </div>

    <script src="../js/api.js"></script>

    <script src="../js/utils.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/dark-mode.js"></script>
    <script src="../js/appointments.js"></script>
    <script src="../js/app.js"></script>

</body>

</html>
