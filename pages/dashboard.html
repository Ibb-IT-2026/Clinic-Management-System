<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - نظام إدارة عيادة الأسنان</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="../styles/variables.css">
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../styles/layout.css">
    <link rel="stylesheet" href="../styles/components.css">
    <link rel="stylesheet" href="../styles/responsive.css">
    <link rel="stylesheet" href="../styles/responsive.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>

<body>

    <header>
        <div class="header-content">
            <div class="logo">
                <i class="fas fa-tooth"></i>
                <span>عيادة الأسنان - د. علي محمد</span>
            </div>
            <div class="user-info">
                <div class="user-avatar">د.ع</div>
                <div>
                    <p>د. علي محمد</p>
                    <p>طبيب أسنان</p>
                </div>
                <button id="logout-btn" class="btn"
                    style="background-color: var(--card-bg); color: var(--primary-color);">
                    <i class="fas fa-sign-out-alt"></i> خروج
                </button>
            </div>
        </div>
    </header>

    <div class="container" style="margin-top: 20px;">
        <nav>
            <ul class="nav-links">
                <li><a href="dashboard.html" class="active"><i class="fas fa-home"></i> الرئيسية</a></li>
                <li><a href="patients.html"><i class="fas fa-users"></i> المرضى</a></li>
                <li><a href="appointments.html"><i class="fas fa-calendar-plus"></i> إضافة موعد</a></li>
                <li><a href="payments.html"><i class="fas fa-money-bill-wave"></i> المدفوعات</a></li>
                <li><a href="records.html"><i class="fas fa-file-medical"></i> سجلات المرضى</a></li>
            </ul>
        </nav>

        <div class="main-content active">
            <div class="dashboard-header">
                <h2 class="section-title" style="border: none; margin: 0;">لوحة التحكم</h2>
                <div class="live-clock"
                    style="background: var(--secondary-color); color: white; padding: 15px 25px; border-radius: var(--border-radius); font-size: 1.5rem; font-weight: bold; box-shadow: var(--box-shadow);">
                    <i class="fas fa-clock"></i> <span id="current-time">--:--:--</span>
                </div>
            </div>

            <div class="dashboard-stats"
                style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 25px; margin-bottom: 35px;">
                <div class="stat-card">
                    <div class="stat-icon" style="background-color: var(--primary-color);">
                        <i class="fas fa-users"></i>
                    </div>
                    <div class="stat-content">
                        <h3 id="total-patients">0</h3>
                        <p>إجمالي المرضى</p>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon" style="background-color: var(--success-color);">
                        <i class="fas fa-calendar-day"></i>
                    </div>
                    <div class="stat-content">
                        <h3 id="today-appointments">0</h3>
                        <p>مواعيد اليوم</p>
                    </div>
                </div>
            </div>

            <!-- Charts Section Removed -->

            <div class="header-content"
                style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3 class="section-title" style="margin: 0; border: none;">الإجراءات السريعة</h3>
            </div>
            <div class="quick-actions"
                style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px;">
                <button class="action-btn" onclick="window.location.href='patients.html?action=add'">
                    <i class="fas fa-user-plus"></i>
                    <span>إضافة مريض جديد</span>
                </button>
                <button class="action-btn" onclick="window.location.href='appointments.html'">
                    <i class="fas fa-calendar-plus"></i>
                    <span>إضافة موعد جديد</span>
                </button>
                <button class="action-btn" onclick="window.location.href='patients.html'">
                    <i class="fas fa-calendar-alt"></i>
                    <span>جدول المواعيد</span>
                </button>
                <button class="action-btn" onclick="window.location.href='payments.html'">
                    <i class="fas fa-money-check-alt"></i>
                    <span>المدفوعات</span>
                </button>
            </div>

            <!-- System Actions Removed -->

            <!-- Reports Section -->
            <!-- Reports Section -->
            <h3 class="section-title">التقارير (PDF)</h3>
            <div class="reports-section"
                style="background-color: var(--card-bg); padding: 25px; border-radius: var(--border-radius); box-shadow: var(--box-shadow); margin-bottom: 30px;">
                <p style="margin-bottom: 15px; color: var(--secondary-color);">اختر الفترة الزمنية لتصدير التقرير الشامل
                    (مواعيد + مالي):</p>
                <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                    <button class="btn" onclick="ReportsManager.generatePDF('daily')"
                        style="background-color: var(--primary-color); color: white; flex: 1;">
                        يومي
                    </button>
                    <button class="btn" onclick="ReportsManager.generatePDF('weekly')"
                        style="background-color: var(--secondary-color); color: white; flex: 1;">
                        أسبوعي
                    </button>
                    <button class="btn" onclick="ReportsManager.generatePDF('monthly')"
                        style="background-color: var(--accent-color); color: var(--dark-color); flex: 1;">
                        شهري
                    </button>
                    <button class="btn" onclick="ReportsManager.generatePDF('yearly')"
                        style="background-color: var(--dark-color); color: white; flex: 1;">
                        سنوي
                    </button>
                </div>
            </div>

            <h3 class="section-title">مواعيد اليوم</h3>
            <div class="today-appointments" id="today-appointments-list"
                style="background-color: var(--card-bg); border-radius: var(--border-radius); padding: 25px; box-shadow: var(--box-shadow); margin-bottom: 30px;">
                <!-- Filled by JS -->
            </div>
        </div>
    </div>

    <div class="dark-mode-toggle">
        <button class="dark-mode-btn" id="dark-mode-toggle">
            <i class="fas fa-moon"></i>
        </button>
    </div>

    <script src="../js/api.js"></script>

    <script src="../js/utils.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/dark-mode.js"></script>
    <!-- Charts.js logic would be here if present -->
    <script src="../js/app.js"></script>
    <script src="../js/appointments.js"></script>

</body>

</html>
